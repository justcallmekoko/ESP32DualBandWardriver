name: Build multi-target C5 installer manifest

on:
  workflow_call:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build_installer_manifest.yml"
      - ".github/workflows/wardriver_build_parallel.yml"
      - "installer/**"
      - "tools/installer_manifest.py"
      - "tools/test_installer_manifest.py"
      - "tools/validate_release_bundle.py"
      - "tools/test_release_bundle.py"
      - "tools/test_release_workflow.py"
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - ".github/workflows/build_installer_manifest.yml"
      - ".github/workflows/wardriver_build_parallel.yml"
      - "installer/**"
      - "tools/installer_manifest.py"
      - "tools/test_installer_manifest.py"
      - "tools/validate_release_bundle.py"
      - "tools/test_release_bundle.py"
      - "tools/test_release_workflow.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate installer metadata tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tools/installer_manifest.py --validate-registry
      - run: python3 -m unittest tools/test_installer_manifest.py tools/test_release_bundle.py -v
      - run: python3 tools/test_release_workflow.py

  build:
    name: Rebuild authoritative multi-target C5 release bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record source commit and firmware version
        run: |
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          VERSION=$(sed -nE 's/^#define FIRMWARE_VERSION "(v[^"]+)"/\1/p' src/configs.h)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Arduino CLI and ESP32 core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.1
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$GITHUB_WORKSPACE/bin"
          mkdir -p "$HOME/.arduino15"
          curl -fsSL https://downloads.arduino.cc/packages/package_index.json \
            -o "$HOME/.arduino15/package_index.json"
          curl -fsSL https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            -o "$HOME/.arduino15/package_esp32_index.json"
          arduino-cli core install esp32:esp32@3.3.0 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install firmware build dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: me-no-dev/AsyncTCP
          ref: ef448a8a1dffe4ec1b72326dd5a26211ff227b49
          path: build-libraries/CustomAsyncTCP
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: stevemarple/MicroNMEA
          ref: v2.0.6
          path: build-libraries/CustomMicroNMEA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: h2zero/NimBLE-Arduino
          ref: 2.3.8
          path: build-libraries/CustomNimBLE-Arduino
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bblanchon/ArduinoJson
          ref: v6.18.2
          path: build-libraries/CustomArduinoJson
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ivanseidel/LinkedList
          ref: v1.3.3
          path: build-libraries/CustomLinkedList
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: plerup/espsoftwareserial
          ref: 8.1.0
          path: build-libraries/CustomEspSoftwareSerial
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: adafruit/Adafruit_BusIO
          ref: 1.15.0
          path: build-libraries/CustomAdafruit_BusIO
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: adafruit/Adafruit_MAX1704X
          ref: 1.0.2
          path: build-libraries/CustomAdafruit_MAX1704X
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: adafruit/Adafruit-GFX-Library
          ref: 1.12.1
          path: build-libraries/CustomAdafruit_GFX
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: adafruit/Adafruit-ST7735-Library
          ref: 1.11.0
          path: build-libraries/CustomAdafruit_ST7735
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pololu/apa102-arduino
          ref: 3.0.0
          path: build-libraries/CustomAPA102
      - name: Apply ESP32-C5 compatibility flags
        run: |
          find "$HOME/.arduino15/packages/esp32/hardware/esp32" -name platform.txt -exec sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' {} +
      - name: Build every registry target and generate metadata
        run: |
          mapfile -t TARGETS < <(python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("installer/targets.json").read_text())
          for target in registry["targets"]:
              print(f"{target['id']}\t{target['buildFlag']}")
          PY
          )
          test "${#TARGETS[@]}" -gt 0

          TARGET_BUILD_ARGS=()
          for target in "${TARGETS[@]}"; do
            IFS=$'\t' read -r TARGET_ID BUILD_FLAG <<< "$target"
            BUILD_DIR="$GITHUB_WORKSPACE/build/installer/$TARGET_ID"
            mkdir -p "$BUILD_DIR"
            arduino-cli compile \
              --fqbn "esp32:esp32:esp32c5:PartitionScheme=min_spiffs,PSRAM=enabled" \
              --build-path "$BUILD_DIR" \
              --libraries "$GITHUB_WORKSPACE/build-libraries" \
              --warnings none \
              --build-property "compiler.cpp.extra_flags=-D$BUILD_FLAG" \
              ./src
            arduino-cli compile \
              --fqbn "esp32:esp32:esp32c5:PartitionScheme=min_spiffs,PSRAM=enabled" \
              --build-path "$BUILD_DIR" \
              --libraries "$GITHUB_WORKSPACE/build-libraries" \
              --warnings none \
              --build-property "compiler.cpp.extra_flags=-D$BUILD_FLAG" \
              --show-properties=expanded \
              ./src > "$BUILD_DIR/arduino-build-properties.txt"
            TARGET_BUILD_ARGS+=(--target-build "$TARGET_ID=$BUILD_FLAG=$BUILD_DIR")
          done

          python3 tools/installer_manifest.py \
            "${TARGET_BUILD_ARGS[@]}" \
            --version "$VERSION" \
            --release-date "$(date -u +%Y%m%d)" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c5-installer-release-bundle
          path: release-assets
          if-no-files-found: error
          retention-days: 5
